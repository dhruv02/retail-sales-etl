name: ETL quality checks and SQL reports
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile project
        run: python -m compileall -q src tests
      - name: Run tests with coverage
        run: python -m pytest -v --cov=retail_pipeline --cov-report=term-missing --cov-fail-under=90 --junitxml=reports/tests.xml
      - name: Demo end-to-end ETL execution
        run: python -m retail_pipeline ingest --input data/sales.csv --db output/ci.sqlite --report output/quality.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: retail-quality-reports-${{ matrix.python-version }}
          path: |
            reports/
            output/quality.json
          if-no-files-found: ignore
